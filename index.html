<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 时代软件设计路线</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273449;
      --surface-light: #334155;
      --ink: #f8fafc;
      --ink-muted: #94a3b8;
      --ink-dim: #64748b;
      --line: #334155;
      --line-soft: #1f2a3d;
      --accent-fundamentals: #64748b;
      --accent-creational: #4f46e5;
      --accent-structural: #059669;
      --accent-behavioral: #7c3aed;
      --accent-architecture: #d97706;
      --accent-ai-engineering: #0891b2;
      --success: #34d399;
      --success-bg: #064e3b;
      --radius: 14px;
      --shadow: 0 8px 32px rgba(0,0,0,.35);
      --sidebar-w: 280px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ============ Hero ============ */
    .hero {
      position: relative;
      padding: 64px 24px 40px;
      text-align: center;
      overflow: hidden;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(79,70,229,.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(124,58,237,.15) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(5,150,105,.1) 0%, transparent 60%);
      pointer-events: none;
    }
    .hero-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }
    .hero h1 {
      position: relative;
      font-size: clamp(2rem, 4.5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -.03em;
      background: linear-gradient(135deg, #60a5fa, #a78bfa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    .hero .slogan {
      position: relative;
      font-size: clamp(1rem, 2.4vw, 1.3rem);
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .hero .subtitle {
      position: relative;
      font-size: .9rem;
      color: #94a3b8;
    }

    /* ============ Layout ============ */
    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      gap: 0;
      width: min(1400px, calc(100% - 48px));
      margin: 0 auto;
      padding: 32px 0 60px;
    }

    /* ============ Sidebar ============ */
    .sidebar {
      position: sticky;
      top: 24px;
      align-self: start;
      max-height: calc(100vh - 48px);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }
    .sidebar-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line-soft);
      flex-shrink: 0;
    }
    .sidebar-title {
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-bottom: 10px;
    }
    .sidebar-overall {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }
    .sidebar-overall strong {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sidebar-overall span {
      font-size: .85rem;
      color: var(--ink-muted);
    }
    .sidebar-overall-bar {
      height: 6px;
      background: var(--surface-light);
      border-radius: 999px;
      overflow: hidden;
    }
    .sidebar-overall-bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f46e5, #7c3aed, #059669);
      border-radius: 999px;
      transition: width .5s cubic-bezier(.4,0,.2,1);
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px 14px;
    }
    .nav-item {
      position: relative;
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: background .15s, transform .12s;
      margin-bottom: 2px;
    }
    .nav-item:hover {
      background: var(--surface-2);
    }
    .nav-item.active {
      background: var(--surface-2);
    }
    .nav-item.active::before {
      content: "";
      position: absolute;
      left: -10px;
      top: 8px;
      bottom: 8px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--cat-accent);
    }
    .nav-icon {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      background: color-mix(in srgb, var(--cat-accent) 18%, transparent);
      color: var(--cat-accent);
      flex-shrink: 0;
    }
    .nav-text {
      min-width: 0;
    }
    .nav-name {
      font-size: .92rem;
      font-weight: 600;
      color: var(--ink);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 5px;
    }
    .nav-progress {
      font-size: .72rem;
      color: var(--ink-muted);
      font-weight: 500;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .nav-bar {
      height: 4px;
      background: var(--surface-light);
      border-radius: 999px;
      overflow: hidden;
    }
    .nav-bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--cat-accent);
      border-radius: 999px;
      transition: width .4s cubic-bezier(.4,0,.2,1);
    }
    .nav-item.done .nav-name::after {
      content: "✓";
      color: var(--success);
      font-size: .8rem;
      margin-left: auto;
    }

    /* ============ Main ============ */
    .main {
      padding-left: 24px;
      min-width: 0;
    }
    .content-section {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
      scroll-margin-top: 16px;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--surface-2);
    }
    .section-head h2 {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-head h2 .icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      background: color-mix(in srgb, var(--cat-accent) 20%, transparent);
      color: var(--cat-accent);
    }
    .section-head .summary {
      font-size: .82rem;
      color: var(--ink-muted);
    }
    .section-head .summary strong {
      color: var(--ink);
      font-weight: 600;
    }

    .pattern-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      border-top: 1px solid var(--line-soft);
      gap: 16px;
      transition: background .12s;
    }
    .pattern-item:first-child {
      border-top: none;
    }
    .pattern-item:hover {
      background: var(--surface-2);
    }
    .pattern-info {
      flex: 1;
      min-width: 0;
    }
    .pattern-name {
      font-weight: 600;
      font-size: .95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pattern-name-en {
      color: var(--ink-muted);
      font-size: .78rem;
      margin-top: 2px;
    }
    .pattern-status {
      font-size: .72rem;
      color: var(--ink-dim);
      margin-top: 3px;
    }
    .pattern-status.learned {
      color: var(--success);
    }
    .pattern-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    .btn-go {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 8px;
      background: var(--cat-accent);
      color: #fff;
      font-size: .82rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity .2s, transform .15s;
      white-space: nowrap;
    }
    .btn-go:hover {
      opacity: .85;
      transform: translateY(-1px);
    }
    .btn-go::after { content: "→"; }
    .pattern-disabled {
      padding: 7px 14px;
      border-radius: 8px;
      background: var(--surface-light);
      color: var(--ink-muted);
      font-size: .82rem;
      white-space: nowrap;
    }
    .btn-learn {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink-muted);
      font-size: .8rem;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
      font-family: inherit;
    }
    .btn-learn:hover {
      border-color: var(--success);
      color: var(--success);
    }
    .btn-learn.learned {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
    }

    /* Empty section */
    .empty {
      padding: 40px 24px;
      text-align: center;
      color: var(--ink-dim);
      font-size: .9rem;
    }

    /* Mobile category switcher */
    .mobile-tabs {
      display: none;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 0 12px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .mobile-tabs::-webkit-scrollbar { display: none; }
    .mobile-tab {
      flex-shrink: 0;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: .82rem;
      color: var(--ink-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
      font-family: inherit;
    }
    .mobile-tab.active {
      background: var(--cat-accent);
      border-color: var(--cat-accent);
      color: #fff;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 32px 24px;
      color: var(--ink-muted);
      font-size: .85rem;
      border-top: 1px solid var(--line);
    }

    /* ============ Responsive ============ */
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .sidebar { display: none; }
      .mobile-tabs { display: flex; }
      .main { padding-left: 0; }
      .pattern-item { padding: 12px 18px; flex-wrap: wrap; }
      .pattern-actions { width: 100%; order: 3; }
      .btn-go, .pattern-disabled { width: 100%; justify-content: center; }
      .btn-learn { width: 100%; }
    }
    @media (max-width: 600px) {
      .hero { padding: 48px 16px 32px; }
      .layout { width: calc(100% - 24px); padding: 20px 0 40px; }
    }
  </style>
</head>
<body>

<section class="hero">
  <div class="hero-grid"></div>
  <h1>AI 时代软件设计路线</h1>
  <p class="slogan">设计模式 · 系统架构 · AI 协作工程</p>
  <p class="subtitle">TypeScript × Python 双语示例 · 从代码结构到架构决策</p>
</section>

<main class="layout">
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">学习目录</div>
      <div class="sidebar-overall">
        <strong id="overallPct">0%</strong>
        <span id="overallLabel">已学习 0 / 0</span>
      </div>
      <div class="sidebar-overall-bar"><i id="overallBar"></i></div>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>

  <section class="main">
    <div class="mobile-tabs" id="mobileTabs"></div>
    <div id="patternSections"></div>
  </section>
</main>

<footer class="footer">
  AI 时代软件设计路线 · 持续更新中
</footer>

<script src="assets/patterns-data.js"></script>
<script>
const PATTERNS = (window.PATTERN_DATA || []).map((p) => ({ ...p }));
const CATEGORIES = (window.PATTERN_CATEGORIES || []).map((c) => ({
  ...c,
  accent: `var(--accent-${c.key})`,
}));

const STORAGE_KEY = "design-pattern-progress";
const TOTAL = PATTERNS.length;
let ACTIVE_KEY = CATEGORIES[0]?.key;

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}
function saveProgress(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function mergeProgress() {
  const saved = loadProgress();
  PATTERNS.forEach(p => {
    if (saved[p.file]) {
      p.status = saved[p.file].status || "pending";
      p.date = saved[p.file].date || null;
    }
  });
}
function learnedIn(cat) {
  return PATTERNS.filter(p => p.cat === cat && p.status === "learned").length;
}
function totalIn(cat) {
  return PATTERNS.filter(p => p.cat === cat).length;
}
function getLearnedCount() {
  return PATTERNS.filter(p => p.status === "learned").length;
}

function updateOverall() {
  const count = getLearnedCount();
  const pct = TOTAL > 0 ? Math.round((count / TOTAL) * 100) : 0;
  document.getElementById("overallPct").textContent = `${pct}%`;
  document.getElementById("overallLabel").textContent = `已学习 ${count} / ${TOTAL}`;
  document.getElementById("overallBar").style.width = `${pct}%`;
}

function renderSidebar() {
  const nav = document.getElementById("sidebarNav");
  nav.innerHTML = CATEGORIES.map(cat => {
    const total = totalIn(cat.key);
    const done = learnedIn(cat.key);
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    const isActive = cat.key === ACTIVE_KEY;
    const isDone = total > 0 && done === total;
    return `
      <div class="nav-item ${isActive ? "active" : ""} ${isDone ? "done" : ""}"
           style="--cat-accent:${cat.accent}"
           data-cat="${cat.key}">
        <div class="nav-icon">${cat.icon}</div>
        <div class="nav-text">
          <div class="nav-name">
            <span>${cat.zh}</span>
            <span class="nav-progress">${done} / ${total}</span>
          </div>
          <div class="nav-bar"><i style="width:${pct}%"></i></div>
        </div>
      </div>
    `;
  }).join("");

  nav.querySelectorAll(".nav-item").forEach(item => {
    item.addEventListener("click", () => {
      setActive(item.dataset.cat, true);
    });
  });
}

function renderMobileTabs() {
  const tabs = document.getElementById("mobileTabs");
  tabs.innerHTML = CATEGORIES.map(cat => `
    <button class="mobile-tab ${cat.key === ACTIVE_KEY ? "active" : ""}"
            style="--cat-accent:${cat.accent}"
            data-cat="${cat.key}">
      ${cat.icon} ${cat.zh}
    </button>
  `).join("");

  tabs.querySelectorAll(".mobile-tab").forEach(tab => {
    tab.addEventListener("click", () => setActive(tab.dataset.cat, true));
  });
}

function renderPatternSections() {
  const container = document.getElementById("patternSections");
  container.innerHTML = CATEGORIES.map(cat => {
    const patterns = PATTERNS.filter(p => p.cat === cat.key);
    const done = learnedIn(cat.key);
    const total = totalIn(cat.key);
    const isActive = cat.key === ACTIVE_KEY;
    const items = patterns.map((p, i) => {
      const isLearned = p.status === "learned";
      const actionHtml = p.file
        ? `<div class="pattern-actions"><a href="${p.file}" class="btn-go">开始学习</a></div>`
        : `<div class="pattern-actions"><span class="pattern-disabled">待补充</span></div>`;
      const statusHtml = isLearned && p.date
        ? `<div class="pattern-status learned">已学习 · ${p.date}</div>`
        : `<div class="pattern-status">未学习</div>`;
      const btnClass = isLearned ? "btn-learn learned" : "btn-learn";
      const btnText = isLearned ? "✓ 已学习" : "标记为已学习";
      return `
        <div class="pattern-item" data-file="${p.file || `pending-${cat.key}-${i}`}">
          <div class="pattern-info">
            <div class="pattern-name">${p.name}</div>
            <div class="pattern-name-en">${p.nameEn}</div>
            ${statusHtml}
          </div>
          ${actionHtml}
          <button class="${btnClass}" data-file="${p.file}" data-status="${p.status}">${btnText}</button>
        </div>
      `;
    }).join("");

    return `
      <div class="content-section ${isActive ? "active" : ""}"
           data-cat="${cat.key}"
           style="--cat-accent:${cat.accent}">
        <div class="section-head">
          <h2><span class="icon">${cat.icon}</span>${cat.zh}</h2>
          <span class="summary">已学习 <strong>${done}</strong> / ${total}</span>
        </div>
        ${patterns.length > 0 ? items : `<div class="empty">本分类暂无内容</div>`}
      </div>
    `;
  }).join("");

  // Learn status buttons
  container.querySelectorAll(".btn-learn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const file = btn.dataset.file;
      if (!file) return;
      const pattern = PATTERNS.find(p => p.file === file);
      if (!pattern) return;

      if (pattern.status === "learned") {
        pattern.status = "pending";
        pattern.date = null;
      } else {
        pattern.status = "learned";
        pattern.date = new Date().toISOString().split("T")[0];
      }

      const saved = loadProgress();
      saved[file] = { status: pattern.status, date: pattern.date };
      saveProgress(saved);

      renderAll();
    });
  });
}

function setActive(key, scroll = false) {
  ACTIVE_KEY = key;
  // Update sidebar
  document.querySelectorAll("#sidebarNav .nav-item").forEach(el => {
    el.classList.toggle("active", el.dataset.cat === key);
  });
  // Update mobile tabs
  document.querySelectorAll("#mobileTabs .mobile-tab").forEach(el => {
    el.classList.toggle("active", el.dataset.cat === key);
  });
  // Update section visibility
  document.querySelectorAll(".content-section").forEach(el => {
    el.style.display = el.dataset.cat === key ? "" : "none";
  });
  if (scroll) {
    const target = document.querySelector(`.content-section[data-cat="${key}"]`);
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

function renderAll() {
  updateOverall();
  renderSidebar();
  renderMobileTabs();
  renderPatternSections();
  setActive(ACTIVE_KEY);
}

// Init
mergeProgress();
renderAll();
</script>

</body>
</html>
